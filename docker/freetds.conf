# FreeTDS server definitions for the on-prem SQL Servers reached through the
# Cloudflare Tunnel. Two `cloudflared access tcp` clients (started in start.sh)
# expose them on 127.0.0.1:14333 / :14334.
#
# The per-server TDS version is REQUIRED and differs:
#   - compaq       (SQL Server 2022)         speaks modern TDS 7.4
#   - basemaquila  (SQL Server 2014 Express) MUST use legacy TDS 7.0
#
# Laravel's `compaq` / `basemaquila` connections set `host` to these section
# names (and an empty port), so FreeTDS resolves host/port/version from here.

[global]
    tds version = 7.4
    client charset = UTF-8
    text size = 20971520
    connect timeout = 10
    timeout = 30

[compaq]
    host = 127.0.0.1
    port = 14333
    tds version = 7.4

[basemaquila]
    host = 127.0.0.1
    port = 14334
    tds version = 7.0
